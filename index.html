<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrlePedia — The Free Encyclopedia</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* Modern Wiki Design Tokens */
        :root {
            --bg-canvas: #f6f6f6;
            --bg-page: #ffffff;
            --wiki-blue: #36b;
            --wiki-blue-hover: #447ff5;
            --wiki-red: #dd3333;
            --border-wiki: #a2a9b1;
            --text-dark: #202122;
            --text-muted: #54595d;
            
            /* GitHub Diff Theme Colors */
            --diff-remove-bg: #ffebe9;
            --diff-remove-text: #65020c;
            --diff-add-bg: #e6ffec;
            --diff-add-text: #0a3014;
            
            /* Byte Change Colors */
            --bytes-positive: darkgreen;
            --bytes-negative: #dc3545;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: var(--bg-canvas); color: var(--text-dark); display: flex; min-height: 100vh; }
        
        /* Mobile Sidebar Adjustments */
        @media (max-width: 768px) {
            body { display: block !important; overflow-x: hidden; }
            aside { 
                position: fixed !important; 
                left: -280px !important; 
                top: 0 !important; 
                height: 100vh !important; 
                z-index: 10002 !important; 
                box-shadow: 2px 0 10px rgba(0,0,0,0.2); 
                transition: left 0.3s ease; 
                background: var(--bg-canvas) !important; 
                width: 250px !important; 
                display: flex !important; 
                flex-direction: column !important;
                margin: 0 !important;
                float: none !important;
            }
            aside.mobile-active { left: 0 !important; }
            aside.mobile-active #mobileHamburgerBtn { display: flex !important; } /* Ensure it stays visible */
            main { 
                padding: 0.5rem 1rem !important; 
                width: 100% !important; 
                margin: 0 !important; 
                display: block !important;
                position: relative !important;
                top: 0 !important;
            }
            #userHeaderBanner { 
                margin-top: 0 !important; 
                padding-left: 45px !important; /* Align with hamburger */
                display: flex !important;
                align-items: center !important;
                gap: 10px !important;
                min-height: 50px !important;
            }
            #identityGreeting { display: none !important; } /* Hide greeting on mobile to save space for search bar */
            .modern-search-container { flex: 1 !important; margin: 0 !important; }
            .firstHeading { font-size: 1.5rem !important; margin-top: 10px !important; }
            .sidebar-toggle-btn { display: none !important; }
            #mobileHamburgerBtn { 
                display: flex !important; 
                position: fixed !important; 
                top: 10px !important; 
                left: 10px !important; 
                z-index: 11000 !important; /* Higher than sidebar z-index (10002) */
                background: var(--wiki-blue) !important; 
                color: white !important; 
                border: none !important; 
                width: 36px !important; 
                height: 36px !important; 
                border-radius: 4px !important; 
                cursor: pointer !important; 
                align-items: center !important; 
                justify-content: center !important; 
            }
            .nav-link span { display: inline !important; }
            .nav-link { justify-content: flex-start !important; padding: 0.8rem 1rem !important; width: 100% !important; }
        }
        #mobileHamburgerBtn { display: none; }

        /* ============ MODERN LOADING SCREEN ============ */
        #globalLoadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f6f6f6 0%, #ffffff 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20000; /* Increased to be above everything */
            transition: opacity 0.5s ease, visibility 0.5s ease;
            font-family: Georgia, serif;
        }

        #globalLoadingOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        .loading-logo-img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(51, 102, 187, 0.2);
            object-fit: contain;
        }

        .loading-logo-text {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: -1px;
            color: var(--text-dark);
        }

        .loading-logo-text span {
            color: var(--wiki-blue);
        }

        .loading-status-message {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            min-height: 24px;
            text-align: center;
            animation: pulse 2s infinite;
        }

        .loading-error-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: #fff5f5;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 20px 30px;
            max-width: 500px;
            text-align: center;
            animation: fadeInUp 0.5s ease;
        }

        .loading-error-container.visible {
            display: flex;
        }

        .loading-error-icon {
            font-size: 2.5rem;
            color: var(--wiki-red);
        }

        .loading-error-title {
            font-weight: bold;
            color: var(--wiki-red);
            font-size: 1.1rem;
        }

        .loading-error-message {
            color: #991b1b;
            font-size: 0.85rem;
            line-height: 1.5;
            max-height: 100px;
            overflow-y: auto;
            text-align: left;
            background: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            font-family: monospace;
            font-size: 0.75rem;
        }

        .loading-retry-btn {
            background: var(--wiki-blue);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .loading-retry-btn:hover {
            background: var(--wiki-blue-hover);
            transform: scale(1.02);
        }

        .loading-retry-btn:active {
            transform: scale(0.98);
        }

        .loading-partial-warning {
            display: none;
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 0.8rem;
            color: #92400e;
            margin-top: 10px;
            max-width: 400px;
            text-align: center;
        }

        .loading-partial-warning.visible {
            display: block;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Left Vector Navigation Sidebar - Collapsible */
        aside { 
            width: 180px; 
            padding: 1.5rem 1rem; 
            display: flex; 
            flex-direction: column; 
            gap: 1rem; 
            border-right: 1px solid var(--border-wiki); 
            background-color: var(--bg-canvas); 
            transition: width 0.3s ease;
            position: relative;
            overflow-y: auto;
            max-height: 100vh;
        }
        
        aside.collapsed { 
            width: 50px; 
            padding: 1rem 0.5rem;
        }
        
        .sidebar-toggle-btn {
            position: absolute;
            top: 1rem;
            right: 0.5rem;
            background: var(--wiki-blue);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        
        aside.collapsed .sidebar-toggle-btn {
            right: auto;
            left: 0.5rem;
        }
        
        .sidebar-toggle-btn:hover {
            background: var(--wiki-blue-hover);
        }
        
        .logo-area { 
            font-size: 1.4rem; 
            font-weight: bold; 
            font-family: Georgia, serif; 
            letter-spacing: -1px; 
            border-bottom: 1px solid var(--border-wiki); 
            padding-bottom: 0.5rem; 
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
        }
        
        aside.collapsed .logo-area {
            font-size: 0.8rem;
            letter-spacing: 0;
        }
        
        .logo-area span { color: var(--wiki-blue); }
        
        .nav-link { 
            font-size: 0.9rem; 
            color: var(--wiki-blue); 
            text-decoration: none; 
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.6rem 0.8rem;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .nav-link:hover {
            background: rgba(51, 102, 187, 0.1);
            text-decoration: none;
        }
        
        aside.collapsed .nav-link span {
            display: none;
        }
        
        aside.collapsed .nav-link {
            justify-content: center;
            padding: 0.6rem 0;
        }

        .nav-group { 
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .nav-sub-menu {
            display: flex;
            flex-direction: column;
            padding-left: 0.5rem;
            margin-top: -0.25rem;
            margin-bottom: 0.5rem;
        }
        aside.collapsed .nav-sub-menu { display: none; }
        .nav-sub-menu a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.4rem 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .nav-sub-menu a:hover { background: rgba(51, 102, 187, 0.05); color: var(--wiki-blue); }
        .nav-sub-menu a i { width: 12px; height: 12px; }
        .nav-link i { width: 18px; height: 18px; }
        
        /* Main Workspace Window Layout */
        main { 
            flex: 1; 
            background-color: var(--bg-page); 
            padding: 1.5rem 2.5rem; 
            display: flex; 
            flex-direction: column; 
            gap: 1rem;
            overflow-y: auto;
        }
        
        /* Global User Status Header */
        #userHeaderBanner { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 1rem; 
            font-size: 0.85rem; 
            border-bottom: 1px solid #eaecf0; 
            padding-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        
        .user-tag { 
            background: #eaf3ff; 
            color: var(--wiki-blue); 
            padding: 0.2rem 0.5rem; 
            border-radius: 4px; 
            font-weight: bold; 
        }
        
        /* Modern Search Bar */
        .modern-search-container {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex: 0 1 300px;
        }
        
        .search-input-wrapper {
            position: relative;
            flex: 1;
        }
        
        .search-input-wrapper input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border-wiki);
            border-radius: 20px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .search-input-wrapper input:focus {
            border-color: var(--wiki-blue);
            box-shadow: 0 0 0 2px rgba(51, 102, 187, 0.1);
        }
        
        .search-results-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-wiki);
            border-top: none;
            border-radius: 0 0 4px 4px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .search-results-dropdown.active {
            display: block;
        }
        
        .search-result-item {
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.85rem;
        }
        
        .search-result-item:hover {
            background: #f8f9fa;
        }
        
        .search-result-thumbnail {
            width: 30px;
            height: 30px;
            background: #f0f0f0;
            border-radius: 2px;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .search-result-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .search-result-info {
            flex: 1;
        }
        
        .search-result-title {
            font-weight: bold;
            color: var(--wiki-blue);
        }
        
        .search-result-namespace {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Article Structure Presentation */
        .firstHeading { 
            font-family: 'Linux Libertine', Georgia, Times, serif; 
            font-size: 1.8rem; 
            border-bottom: 1px solid var(--border-wiki); 
            padding-bottom: 0.25rem; 
            margin-bottom: 0.5rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .article-meta-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            width: 100%;
        }
        
        .wiki-tabs { 
            display: flex; 
            gap: 0.5rem; 
            font-size: 0.8rem; 
            margin-bottom: 1rem; 
            border-bottom: 1px solid #eaecf0;
            align-items: center;
        }
        
        .wiki-tab { 
            padding: 0.4rem 0.8rem; 
            border: 1px solid transparent; 
            border-bottom: none; 
            cursor: pointer; 
            color: var(--wiki-blue); 
        }
        
        .wiki-tab.active { 
            background: var(--bg-page); 
            border-color: var(--border-wiki); 
            border-bottom: 1px solid var(--bg-page); 
            margin-bottom: -1px; 
            color: var(--text-dark); 
            font-weight: bold; 
        }

        .more-tabs-dropdown {
            position: relative;
            display: inline-block;
        }

        .more-tabs-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1001;
            border: 1px solid var(--border-wiki);
            border-radius: 4px;
        }

        .more-tabs-content div {
            color: var(--wiki-blue);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            cursor: pointer;
        }

        .more-tabs-content div:hover { background-color: #f1f1f1; }
        .more-tabs-dropdown:hover .more-tabs-content { display: block; }

        .infobox-toggle-controls { display:flex; justify-content:center; gap:0; border-top:1px solid #a2a9b1; background:#f8f9fa; padding:0.25rem; }
        .infobox-toggle-control { border:1px solid #a2a9b1; border-right:0; background:#f8f9fa; color:var(--wiki-blue); padding:0.25rem 0.7rem; font-size:0.75rem; cursor:pointer; }
        .infobox-toggle-control:first-child { border-radius:2px 0 0 2px; }
        .infobox-toggle-control:last-child { border-right:1px solid #a2a9b1; border-radius:0 2px 2px 0; }
        .infobox-toggle-control.active { background:#fff; color:var(--text-dark); font-weight:bold; box-shadow:inset 0 -2px 0 var(--wiki-blue); }
        .infobox-toggle-panel { background:#fff; padding:0.25rem; }

        .h2-section-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-wiki);
            margin: 0.2rem 0;
            padding-bottom: 0.2rem;
            font-family: sans-serif;
            font-size: 1.1rem;
            background: transparent;
            width: 100%;
        }

        .h2-section-header:hover { background: #f8f9fa; }

        .h2-section-title {
            display: flex;
            align-items: center;
            font-weight: normal !important;
            margin: 0;
            padding: 0;
        }

        .h2-section-content {
            display: block;
            margin-bottom: 0.5rem;
        }

        .h2-section-content.collapsed { display: none; }

        .edit-pencil {
            font-size: 0.8rem;
            color: var(--wiki-blue);
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
            display: none;
        }

        .edit-pencil.visible { display: inline-block; }
        .edit-pencil:hover { opacity: 1; }

        /* Built-In MediaWiki Styles */
        .wiki-body p, .first-para { 
            margin-bottom: 0.8rem; 
            line-height: 1.6; 
            font-size: 1rem; 
            text-align: justify; 
            font-family: sans-serif;
        }
        
        .wiki-body h2 { 
            font-family: Georgia, serif; 
            font-size: 1.5rem; 
            border-bottom: 1px solid var(--border-wiki); 
            margin: 1.5rem 0 0.5rem 0; 
            padding-bottom: 0.2rem; 
        }
